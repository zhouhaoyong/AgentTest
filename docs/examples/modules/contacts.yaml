module_id: contacts
title: 联系人
verified_version: v0.0.1
viewport: 1920x1080
pages:
  - id: contacts-list
    url_pattern: /contacts
    name: 联系人列表
    entry:
      - type: url
        value: /contacts
    states:
      - id: default
        description: 已进入联系人列表且列表可读
    elements:
      - id: contact-add
        purpose: 打开新增联系人表单
        locator:
          primary:
            type: testid
            value: contact-add
          fallback:
            - type: role
              value: button[name="添加联系人"]
        text: 添加联系人
        stability: data-testid
        action: 点击后打开新增联系人表单
        expected_state: 当前页打开联系人表单（/contacts/new）
        verified_version: v0.0.1
        verified_viewport: 1920x1080
  - id: contacts-form
    url_pattern: /contacts/new
    name: 联系人表单
    states:
      - id: default
        description: 新增联系人表单已展示
    elements:
      - id: contact-name
        purpose: 填写联系人姓名
        locator:
          primary:
            type: label
            value: 姓名
          fallback:
            - type: css
              value: '[name="contact_name"]'
        text: 姓名
        stability: 表单 label / name
        action: 输入联系人姓名
        expected_state: 输入框回显所填姓名，可继续保存
        verified_version: v0.0.1
        verified_viewport: 1920x1080
